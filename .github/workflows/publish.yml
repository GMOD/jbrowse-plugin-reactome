name: Publish

# npm trusted publishing: npmjs.com lists this repository and this workflow file
# as the package's publisher, and the job exchanges its OIDC token for a publish
# credential, so no npm token lives in the repository's secrets. Release with
# `pnpm version <patch|minor|major>`, which pushes the tag that runs this.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # a version already on npm, e.g. one published by hand, is not an error
      - id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public --provenance --ignore-scripts
